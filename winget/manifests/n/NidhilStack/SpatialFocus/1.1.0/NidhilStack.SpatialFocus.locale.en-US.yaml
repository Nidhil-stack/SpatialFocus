ShortDescription: Switch windows by the spatial position of right-hand keys
Description: |-
  Hold CapsLock with the left hand and every open window shows a key from the right half of the keyboard,
  placed where the window sits on screen. Press that key and focus jumps there. All monitors are treated
  as one rectangle. Only windows that are actually visible get a key, and a shortcut
  tiles the visible windows while keeping their arrangement. A keyboard volume knob can also be used to scroll.
